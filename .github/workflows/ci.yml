name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/codexa_ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codexa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile --os="*" --cpu="*"

      - name: Generate Prisma client
        run: bun run --cwd packages/database db:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test with Coverage
        run: bun test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

      - name: Build web
        run: bun run build:web

      - name: Build server
        run: bun run --cwd packages/server build

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Lint shell scripts
        run: shellcheck install.sh scripts/package-release.sh

      - name: Compile and smoke-test Linux executable
        run: |
          version="$(bun -e 'console.log(require("./packages/cli/package.json").version)')"
          bun scripts/build-release.ts bun-linux-x64-baseline
          bun scripts/smoke-release.ts artifacts/linux-x64/codexa "$version"

  windows-installer-syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse PowerShell installer
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null'

  alpine-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64-musl-baseline
            artifact: linux-x64-musl
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64-musl
            artifact: linux-arm64-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install every platform-specific OpenTUI package
        run: bun install --frozen-lockfile --os="*" --cpu="*"

      - name: Build release binary
        run: bun scripts/build-release.ts ${{ matrix.target }}

      - name: Smoke-test in Alpine Linux
        run: |
          version="$(bun -e 'console.log(require("./packages/cli/package.json").version)')"
          chmod +x "artifacts/${{ matrix.artifact }}/codexa"
          docker run --rm -v "$PWD/artifacts/${{ matrix.artifact }}:/work:ro" \
            alpine:latest sh -ec \
            'apk add --no-cache libstdc++ libgcc > /dev/null; /work/codexa --version' \
            | grep "codexa $version"
